<!DOCTYPE html>
<html lang="fr">
<head>
    <meta name="description" content="Découvrez le projet Manga Sakura Collector développé par Nathan. Un site web de scan de code barre de vos manga pour sauvegarder !">

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://nathan-pro-fr.github.io/Porftolio_Nathan/Projets/msc/index.html">
    <meta property="og:title" content="Projet MSC | Développements Nathan">
    <meta property="og:description" content="Scannez le code barre de vos mangas et sauvegardez le !">
    <meta property="og:image" content="https://nathan-pro-fr.github.io/Porftolio_Nathan/Site-principal/Images/Image_fond_Porfolios_v2.webp">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manga Sakura Collector - Visionneuse</title>
    <link rel="icon" type="image/svg" href="Images/icons/Favicon_Porfolio_sakura.svg">    
    <link rel="apple-touch-icon" href="Images/icons/Favicon_Porfolio_sakura.svg">
    <style>
        :root {
            --bg-color: #141214;
            --card-bg: #1f1a1f;
            --sakura-pink: #FFB7C5;
            --sakura-dark: #ff9aa2;
            --text-color: #f5eff5;
            --text-muted: #b5aab5;
            --border-color: #382c35;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        /* Header avec la DA Sakura */
        header {
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(180deg, #2a1e25 0%, var(--bg-color) 100%);
            border-bottom: 2px solid var(--border-color);
        }

        header h1 {
            font-size: 2.5rem;
            color: var(--sakura-pink);
            margin: 0 0 10px 0;
            text-shadow: 0 0 15px rgba(255, 183, 197, 0.3);
        }

        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin: 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        /* Zone d'import de fichier Dropzone */
        .dropzone-container {
            max-width: 600px;
            margin: 0 auto 40px auto;
        }

        .dropzone {
            border: 2px dashed var(--sakura-pink);
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .dropzone:hover, .dropzone.dragover {
            background-color: #2d222a;
            box-shadow: 0 0 20px rgba(255, 183, 197, 0.15);
            transform: scale(1.01);
        }

        .dropzone p {
            margin: 10px 0 0 0;
            color: var(--text-color);
            font-size: 1.1rem;
        }

        .dropzone span {
            color: var(--text-muted);
            font-size: 0.9rem;
            display: block;
            margin-top: 5px;
        }

        .dropzone .icon {
            font-size: 3rem;
            color: var(--sakura-pink);
        }

        #file-input {
            display: none;
        }

        /* Compteur de la collection */
        .stats-bar {
            text-align: center;
            margin-bottom: 30px;
            display: none;
        }

        .stats-badge {
            background-color: #2d222a;
            border: 1px solid var(--sakura-pink);
            color: var(--sakura-pink);
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: 600;
            display: inline-block;
        }

        /* Grille de mangas */
        .manga-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 30px;
        }

        /* Cartes Style Discord Embed modifié */
        .manga-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), border-color 0.3s ease;
        }

        .manga-card:hover {
            transform: translateY(-8px);
            border-color: var(--sakura-pink);
            box-shadow: 0 12px 24px rgba(255, 183, 197, 0.1);
        }

        .manga-cover-wrapper {
            width: 100%;
            height: 280px;
            background-color: #100e10;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border-bottom: 1px solid var(--border-color);
        }

        .manga-cover {
            height: 100%;
            width: 100%;
            object-fit: contain;
            padding: 10px;
            box-sizing: border-box;
        }

        .manga-details {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .manga-title {
            font-size: 1.2rem;
            margin: 0 0 6px 0;
            color: #fff;
            font-weight: 600;
            line-height: 1.4;
        }

        .manga-author {
            color: var(--sakura-dark);
            font-size: 0.95rem;
            margin: 0 0 15px 0;
            font-weight: 500;
        }

        .manga-meta {
            margin-top: auto;
            border-top: 1px solid var(--border-color);
            padding-top: 12px;
            font-size: 0.8rem;
        }

        .meta-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .meta-row:last-child {
            margin-bottom: 0;
        }

        .meta-label {
            color: var(--text-muted);
            font-weight: 500;
        }

        .meta-value {
            color: #e2dae2;
            max-width: 160px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .user-tag {
            color: var(--sakura-pink);
            background-color: rgba(255, 183, 197, 0.1);
            padding: 1px 6px;
            border-radius: 4px;
            font-family: monospace;
        }

        /* Animation d'apparition */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .manga-card {
            animation: fadeIn 0.4s ease forwards;
        }
    </style>
</head>
<body>

    <header>
        <h1>🌸 Manga Sakura Collector</h1>
        <p>Visionneuse web officielle de votre collection de mangas</p>
    </header>

    <div class="container">
        
        <!-- Zone d'import -->
        <div class="dropzone-container">
            <div class="dropzone" id="dropzone" onclick="document.getElementById('file-input').click()">
                <div class="icon">✨</div>
                <p>Glissez-déposez votre fichier <b>.json</b> ici</p>
                <span>ou cliquez pour parcourir vos fichiers</span>
                <input type="file" id="file-input" accept=".json">
            </div>
        </div>

        <!-- Barre de statistiques -->
        <div class="stats-bar" id="stats-bar">
            <div class="stats-badge" id="manga-count">0 mangas enregistrés</div>
        </div>

        <!-- Grille d'affichage -->
        <main class="manga-grid" id="manga-grid">
            <!-- Rempli dynamiquement -->
        </main>

    </div>

    <script>
        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('file-input');
        const grid = document.getElementById('manga-grid');
        const statsBar = document.getElementById('stats-bar');
        const mangaCount = document.getElementById('manga-count');

        // Événements du Drag & Drop
        ['dragenter', 'dragover'].forEach(eventName => {
            dropzone.addEventListener(eventName, (e) => {
                e.preventDefault();
                dropzone.classList.add('dragover');
            }, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropzone.addEventListener(eventName, (e) => {
                e.preventDefault();
                dropzone.classList.remove('dragover');
            }, false);
        });

        dropzone.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            const files = dt.files;
            handleFiles(files);
        });

        fileInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
        });

        // Lecture du fichier JSON
        function handleFiles(files) {
            if (files.length === 0) return;
            const file = files[0];
            
            if (file.type !== "application/json" && !file.name.endsWith('.json')) {
                alert("❌ Oups ! Veuillez sélectionner un fichier au format .json valide.");
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    renderCollection(data);
                } catch (error) {
                    alert("❌ Erreur de lecture : Le fichier JSON semble corrompu ou mal structuré.");
                }
            };
            reader.readAsText(file);
        }

        // Nettoyage et affichage de la date (Format Discord-friendly)
        function formatDisplayDate(dateStr) {
            try {
                // Nettoie la date fournie par interaction.created_at
                const cleanStr = dateStr.split('.')[0].replace(' ', 'T');
                const date = new Date(cleanStr);
                if (isNaN(date.getTime())) return dateStr.split(' ')[0]; 
                return date.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' });
            } catch {
                return dateStr;
            }
        }

        // Génération des cartes
        function renderCollection(mangas) {
            if (!Array.isArray(mangas)) {
                alert("❌ Le fichier JSON importé ne contient pas une liste de mangas valide.");
                return;
            }

            grid.innerHTML = '';
            
            if (mangas.length === 0) {
                grid.innerHTML = `<p style="text-align:center; width:100%; color:var(--text-muted);">🌸 Votre collection est vide.</p>`;
                return;
            }

            // Mise à jour du compteur de mangas
            mangaCount.innerText = `🌸 Collection : ${mangas.length} manga${mangas.length > 1 ? 's' : ''}`;
            statsBar.style.display = 'block';

            // Boucle de rendu
            mangas.forEach((manga, index) => {
                const authors = Array.isArray(manga.authors) ? manga.authors.join(', ') : 'Auteur inconnu';
                const formattedDate = manga.added_at ? formatDisplayDate(manga.added_at) : 'Date inconnue';
                
                // Nettoyage du tag utilisateur (pour retirer le #0 si nécessaire)
                const userTag = manga.added_by ? manga.added_by.replace('#0', '') : 'Inconnu';

                const card = document.createElement('div');
                card.className = 'manga-card';
                card.style.animationDelay = `${index * 0.05}s`; // Effet cascade sympa

                card.innerHTML = `
                    <div class="manga-cover-wrapper">
                        <img class="manga-cover" src="${manga.thumbnail}" alt="Couverture" onerror="this.src='https://via.placeholder.com/150x220?text=Pas+de+Couverture'">
                    </div>
                    <div class="manga-details">
                        <h2 class="manga-title" title="${manga.title}">${manga.title}</h2>
                        <p class="manga-author">${authors}</p>
                        
                        <div class="manga-meta">
                            <div class="meta-row">
                                <span class="meta-label">ISBN</span>
                                <span class="meta-value">${manga.isbn || 'Non spécifié'}</span>
                            </div>
                            <div class="meta-row">
                                <span class="meta-label">Ajouté par</span>
                                <span class="meta-value"><span class="user-tag">@${userTag}</span></span>
                            </div>
                            <div class="meta-row">
                                <span class="meta-label">Le</span>
                                <span class="meta-value">${formattedDate}</span>
                            </div>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }
    </script>
</body>
</html>
